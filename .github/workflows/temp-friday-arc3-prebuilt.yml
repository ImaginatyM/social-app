name: TEMP FRIDAY ARC-AGI-3 prebuilt CPU

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-friday-arc3-prebuilt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prebuilt-cpu-arc3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FRIDAY_MODEL_BASE_URL: http://127.0.0.1:8080/v1
      FRIDAY_MODEL_ID: friday-qwen3-8b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ARC and prebuilt local runtime
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'arc-agi==0.9.9' 'huggingface_hub>=1.0' \
            'llama-cpp-python[server]' --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          hf download Qwen/Qwen3-8B-GGUF Qwen3-8B-Q4_K_M.gguf --local-dir /tmp/qwen3
      - name: Start prebuilt local Qwen3-8B Q4 server
        shell: bash
        run: |
          nohup python -m llama_cpp.server \
            --model /tmp/qwen3/Qwen3-8B-Q4_K_M.gguf \
            --model_alias "$FRIDAY_MODEL_ID" \
            --host 127.0.0.1 --port 8080 \
            --n_ctx 4096 --n_threads 4 \
            > /tmp/friday-arc3-prebuilt.log 2>&1 &
          echo $! > /tmp/friday-arc3-prebuilt.pid
          for attempt in $(seq 1 180); do
            if curl --fail --silent http://127.0.0.1:8080/v1/models >/dev/null 2>&1; then
              free -h
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/friday-arc3-prebuilt.pid)" 2>/dev/null; then
              tail -n 200 /tmp/friday-arc3-prebuilt.log
              exit 1
            fi
            sleep 3
          done
          tail -n 200 /tmp/friday-arc3-prebuilt.log
          exit 1
      - name: Deterministic baseline on three public environments
        run: python benchmarks/friday_arc3_cpu.py --games ar25,ls20,dc22 --max-actions 36 --no-model
      - name: Compact Qwen controller on same environments
        run: python benchmarks/friday_arc3_cpu.py --games ar25,ls20,dc22 --max-actions 36 --model-every 12 --timeout 45
      - name: Runtime evidence
        if: always()
        shell: bash
        run: |
          tail -n 250 /tmp/friday-arc3-prebuilt.log || true
          free -h || true
      - name: Stop local model
        if: always()
        run: kill "$(cat /tmp/friday-arc3-prebuilt.pid)" 2>/dev/null || true
