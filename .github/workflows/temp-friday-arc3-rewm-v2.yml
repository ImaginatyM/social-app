name: TEMP FRIDAY ARC-AGI-3 REWM v2

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/friday_arc3_rewm_v2.py'
      - '.github/workflows/temp-friday-arc3-rewm-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rewm-v2-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official ARC toolkit
        run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9'
      - name: Run REWM v2 click and keyboard diagnostics
        run: python benchmarks/friday_arc3_rewm_v2.py --games ft09,lp85,ls20 --max-actions 300
