name: TEMP FRIDAY ARC-AGI-3 deterministic baseline

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-friday-arc3-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-arc3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official ARC runtime
        run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9'
      - name: Run deterministic five-environment baseline
        run: python benchmarks/friday_arc3_cpu.py --games ar25,ft09,lp85,ls20,dc22 --max-actions 60 --no-model
