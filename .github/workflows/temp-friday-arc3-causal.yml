name: TEMP FRIDAY ARC-AGI-3 causal gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'benchmarks/friday_arc3_causal.py'
      - '.github/workflows/temp-friday-arc3-causal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  causal-first-level-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official ARC runtime
        run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9'
      - name: Run five-environment causal first-level gate
        run: python benchmarks/friday_arc3_causal.py --games ar25,ft09,lp85,ls20,dc22
