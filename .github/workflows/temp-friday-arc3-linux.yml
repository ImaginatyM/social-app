name: TEMP FRIDAY local ARC-AGI-3 Linux

on:
  pull_request:
    branches:
      - main
    paths:
      - 'benchmarks/friday_arc3_cpu.py'
      - '.github/workflows/temp-friday-arc3-linux.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-friday-arc3-linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-qwen-arc3-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FRIDAY_MODEL_BASE_URL: http://127.0.0.1:8080/v1
      FRIDAY_MODEL_ID: friday-qwen3-8b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record runner evidence
        shell: bash
        run: |
          uname -a
          lscpu | sed -n '1,25p'
          free -h
      - name: Install ARC and build llama.cpp
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'arc-agi==0.9.9'
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/llama.cpp/build -j 4 --target llama-server
      - name: Start local Qwen3-8B Q4
        shell: bash
        run: |
          nohup /tmp/llama.cpp/build/bin/llama-server \
            -hf Qwen/Qwen3-8B-GGUF:Q4_K_M \
            --alias "$FRIDAY_MODEL_ID" \
            --host 127.0.0.1 --port 8080 -c 4096 -np 1 \
            > /tmp/friday-public-arc3-llama.log 2>&1 &
          echo $! > /tmp/friday-public-arc3-llama.pid
          for attempt in $(seq 1 240); do
            if curl --fail --silent http://127.0.0.1:8080/v1/models >/tmp/friday-public-arc3-models.json 2>/dev/null; then
              cat /tmp/friday-public-arc3-models.json
              free -h
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/friday-public-arc3-llama.pid)" 2>/dev/null; then
              tail -n 200 /tmp/friday-public-arc3-llama.log
              exit 1
            fi
            sleep 5
          done
          tail -n 200 /tmp/friday-public-arc3-llama.log
          exit 1
      - name: Run deterministic baseline
        run: python benchmarks/friday_arc3_cpu.py --games ar25,ls20,dc22 --max-actions 48 --no-model
      - name: Run compact local-Qwen controller
        run: python benchmarks/friday_arc3_cpu.py --games ar25,ls20,dc22 --max-actions 48 --model-every 12 --timeout 45
      - name: Runtime evidence
        if: always()
        shell: bash
        run: |
          tail -n 250 /tmp/friday-public-arc3-llama.log || true
          free -h || true
          ps -o pid,rss,vsz,command -p "$(cat /tmp/friday-public-arc3-llama.pid 2>/dev/null)" || true
      - name: Stop local model
        if: always()
        shell: bash
        run: |
          if test -f /tmp/friday-public-arc3-llama.pid; then
            kill "$(cat /tmp/friday-public-arc3-llama.pid)" 2>/dev/null || true
          fi
