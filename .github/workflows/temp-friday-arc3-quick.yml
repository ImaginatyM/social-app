name: TEMP FRIDAY ARC-AGI-3 quick diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-friday-arc3-quick.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick-local-qwen-arc3:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FRIDAY_MODEL_BASE_URL: http://127.0.0.1:8080/v1
      FRIDAY_MODEL_ID: friday-qwen3-8b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ARC and build llama.cpp
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'arc-agi==0.9.9'
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=ON
          cmake --build /tmp/llama.cpp/build -j 4 --target llama-server
      - name: Start local Qwen3-8B Q4
        shell: bash
        run: |
          nohup /tmp/llama.cpp/build/bin/llama-server -hf Qwen/Qwen3-8B-GGUF:Q4_K_M \
            --alias "$FRIDAY_MODEL_ID" --host 127.0.0.1 --port 8080 -c 4096 -np 1 \
            > /tmp/friday-arc3-quick.log 2>&1 &
          echo $! > /tmp/friday-arc3-quick.pid
          for attempt in $(seq 1 240); do
            if curl --fail --silent http://127.0.0.1:8080/v1/models >/dev/null 2>&1; then exit 0; fi
            if ! kill -0 "$(cat /tmp/friday-arc3-quick.pid)" 2>/dev/null; then tail -n 200 /tmp/friday-arc3-quick.log; exit 1; fi
            sleep 5
          done
          exit 1
      - name: Run quick five-environment diagnostic
        run: python benchmarks/friday_arc3_local.py --games ar25,ft09,lp85,ls20,dc22 --max-actions 20 --model-every 5
      - name: Runtime evidence
        if: always()
        run: |
          tail -n 200 /tmp/friday-arc3-quick.log || true
          free -h || true
      - name: Stop local model
        if: always()
        run: kill "$(cat /tmp/friday-arc3-quick.pid)" 2>/dev/null || true
