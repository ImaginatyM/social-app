name: TEMP FRIDAY M13.7 Astra gate

on:
  pull_request:
    branches:
      - benchmark/friday-arc3-rewm-v2-2026-10-26
    paths:
      - 'benchmarks/friday_arc3_m137_gate.py'
      - '.github/workflows/temp-friday-m137-astra-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arc-m137-five-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official ARC toolkit
        run: python -m pip install --disable-pip-version-check 'arc-agi==0.9.9'
      - name: Run M13.7 five-game ARC gate
        env:
          PYTHONUNBUFFERED: '1'
        run: python benchmarks/friday_arc3_m137_gate.py --games ar25,ft09,lp85,ls20,dc22 --max-actions 300
